<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinControl Offline</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #f8fafc;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        }
        .card {
            max-width: 480px;
            width: 100%;
            background: rgba(15, 23, 42, .9);
            border: 1px solid rgba(148, 163, 184, .2);
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 18px 50px rgba(0,0,0,.3);
        }
        h1 { margin-bottom: 8px; }
        p { line-height: 1.6; color: #cbd5e1; }
        a {
            display: inline-block;
            margin-top: 12px;
            padding: 10px 16px;
            border-radius: 999px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>Você está offline</h1>
        <p>O FinControl já salvou seus dados localmente. Quando a internet voltar, o app sincronizará normalmente.</p>
        <a href="/">Voltar para o app</a>
    </main>
</body>
</html>
